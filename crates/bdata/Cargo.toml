[package]
name = "sabr-data"
description = "Data primitives for sabr-rs: fetch keys, provenance, freshness, source policy and the raw SQLite+zstd store"
version.workspace = true
edition.workspace = true

[dependencies]
thiserror.workspace = true
chrono.workspace = true
rusqlite.workspace = true
sabr-model.workspace = true
time.workspace = true
zstd = "0.13"
sha2 = "0.10"

serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "2", default-features = false, features = ["rustls"] }
[dev-dependencies]
tempfile = "3"
